[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recengine"
version = "0.2.0"
description = "A product recommender for the Online Retail transaction log, with an honest top-N evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Nihad Aslanzade" }]
keywords = ["recommender-systems", "collaborative-filtering", "implicit-feedback", "flask"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "flask>=3.0",
    "gunicorn>=21.2",
]

[project.optional-dependencies]
# Only the legacy baseline needs Surprise. Keeping it optional means the
# package, the API and the test suite all install without it.
legacy = ["scikit-surprise>=1.1.4"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/nihadaslanzade-02/AI-Powered-Recommendation-Engine"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
